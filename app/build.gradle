plugins { id 'com.android.application' }
android {
    namespace 'br.com.gdm.crossingblock.seeds'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.gdm.crossingblock.seeds'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { if (rootProject.file('.tools/debug.keystore').exists()) { storeFile rootProject.file('.tools/debug.keystore') } } }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    testImplementation 'junit:junit:4.13.2'
}
